<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Átalányadó Kalkulátor 2026</title>
  <!-- Minden erőforrás helyben van kiszolgálva: nincs külső (Google, CDN) kérés, így nem kerül IP-cím harmadik félhez. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-display: swap;
      font-weight: 100 800;
      src: url('fonts/jetbrains-mono-latin-ext-wght-normal.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-display: swap;
      font-weight: 100 800;
      src: url('fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      min-height: 100vh;
      background: #0a0f1a;
      color: #e8e6e1;
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
      padding: 32px 16px;
    }

    .calc-container {
      max-width: 520px;
      margin: 0 auto;
    }

    .calc-header {
      margin-bottom: 40px;
      position: relative;
    }

    .calc-header h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #4ade80;
      margin: 0 0 8px 0;
    }

    .calc-header h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 6px 0;
      line-height: 1.2;
    }

    .year-badge {
      display: inline-block;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #0a0f1a;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .input-field {
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      border-color: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1);
    }

    .input-field::placeholder {
      color: #374151;
      font-weight: 400;
    }

    .input-hint {
      font-size: 11px;
      color: #4b5563;
      margin-top: 6px;
    }

    .toggle-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .toggle-btn {
      flex: 1;
      min-width: 120px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .toggle-btn.active {
      background: #111827;
      border-color: #4ade80;
      color: #4ade80;
    }

    .toggle-btn:hover {
      border-color: #374151;
    }

    .cost-ratio-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .cost-ratio-btn {
      flex: 1;
      min-width: 80px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 14px 8px 10px 8px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .cost-ratio-btn:hover {
      border-color: #374151;
    }

    .cost-ratio-btn.active {
      border-color: #4ade80;
    }

    .cost-ratio-btn .pct {
      display: block;
      font-size: 22px;
      font-weight: 700;
      color: #6b7280;
      line-height: 1;
      margin-bottom: 6px;
    }

    .cost-ratio-btn.active .pct {
      color: #4ade80;
    }

    .cost-ratio-btn .desc {
      display: block;
      font-size: 9px;
      color: #4b5563;
      line-height: 1.3;
      letter-spacing: 0.3px;
    }

    .cost-ratio-btn.active .desc {
      color: #6b7280;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #1f2937, transparent);
      margin: 32px 0;
    }

    .result-section {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-hero {
      background: linear-gradient(135deg, #111827 0%, #0d1525 100%);
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 28px 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .result-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #4ade80, #22c55e, #16a34a);
    }

    .result-hero .label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4ade80;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .result-hero .amount {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      margin-bottom: 4px;
    }

    .result-hero .sub {
      font-size: 13px;
      color: #6b7280;
    }

    .breakdown-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .breakdown-card .card-title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1a2234;
    }

    .breakdown-row:last-child {
      border-bottom: none;
    }

    .breakdown-row .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .breakdown-row .dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .breakdown-row .name {
      font-size: 13px;
      color: #9ca3af;
    }

    .breakdown-row .rate {
      font-size: 11px;
      color: #4b5563;
      margin-left: 4px;
    }

    .breakdown-row .value {
      font-size: 14px;
      font-weight: 600;
      color: #e5e7eb;
    }

    .breakdown-row.total {
      border-top: 1px solid #2d3748;
      margin-top: 4px;
      padding-top: 12px;
    }

    .breakdown-row.total .name {
      color: #f87171;
      font-weight: 600;
    }

    .breakdown-row.total .value {
      color: #f87171;
      font-size: 16px;
    }

    .bar-container {
      width: 100%;
      height: 32px;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      margin: 16px 0 8px 0;
      background: #1a2234;
    }

    .bar-segment {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: #0a0f1a;
      transition: width 0.5s ease;
      min-width: 0;
    }

    .bar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .bar-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #6b7280;
    }

    .bar-legend-item .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .info-banner {
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.2);
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .info-banner .icon {
      color: #4ade80;
      font-size: 14px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .info-banner .text {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }

    .warning-banner {
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.2);
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .warning-banner .icon {
      color: #fbbf24;
      font-size: 14px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .warning-banner .text {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: #374151;
      margin-top: 32px;
      letter-spacing: 1px;
    }

    .privacy-note {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px 14px;
      margin: -16px 0 28px 0;
      font-size: 11px;
      line-height: 1.6;
      color: #9ca3af;
    }

    .privacy-note strong {
      color: #e5e7eb;
      font-weight: 600;
    }

    .privacy-note a {
      color: #4ade80;
    }

    .privacy-note .icon {
      flex-shrink: 0;
    }

    .disclaimer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid #1f2937;
      font-size: 11px;
      line-height: 1.6;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="calc.js"></script>
  <script type="text/babel">
    const { useState, useMemo } = React;
    const { TAX_RULES_2026, STATUS, calculate } = window.AtalanyCalc;

    const COST_RATIOS = [
      { value: 0.45, label: "45%", desc: "Általános (minden más tevékenység)" },
      { value: 0.80, label: "80%", desc: "Kizárólag listázott kisipar és/vagy vendéglátás" },
      { value: 0.90, label: "90%", desc: "Kizárólag kiskereskedelem (vendéglátás nem)" },
    ];

    const STATUS_OPTIONS = [
      { value: STATUS.MAIN, label: "Főfoglalkozású" },
      { value: STATUS.SIDE, label: "Mellékfoglalkozású" },
      { value: STATUS.PENSIONER, label: "Nyugdíjas" },
    ];

    function formatHuf(amount) {
      return new Intl.NumberFormat("hu-HU", {
        style: "currency",
        currency: "HUF",
        maximumFractionDigits: 0,
      }).format(amount);
    }

    function calcPercent(part, total) {
      if (total === 0) return 0;
      return ((part / total) * 100).toFixed(1);
    }

    function App() {
      const [projectAmount, setProjectAmount] = useState("");
      const [costRatio, setCostRatio] = useState(0.45);
      const [status, setStatus] = useState(STATUS.MAIN);
      const [requiresDegree, setRequiresDegree] = useState(false);
      const [szjaExempt, setSzjaExempt] = useState(false);
      const [aboveTaxFree, setAboveTaxFree] = useState(true);

      const isMain = status === STATUS.MAIN;
      const isPensioner = status === STATUS.PENSIONER;
      const incomeRatio = 1 - costRatio;

      const result = useMemo(() => {
        const r = calculate({
          revenue: projectAmount,
          aboveTaxFree,
          costRatio,
          status,
          requiresDegree: isMain && requiresDegree,
          szjaExempt,
        });
        return r.revenue === 0 ? null : r;
      }, [projectAmount, aboveTaxFree, costRatio, status, isMain, requiresDegree, szjaExempt]);

      return (
        <div className="calc-container">
          <div className="calc-header">
            <h1>Átalányadó Kalkulátor</h1>
            <h2>Mennyi marad a projektemből?</h2>
            <span className="year-badge">2026</span>
          </div>

          <div className="privacy-note">
            <span className="icon">🔒</span>
            <span>
              <strong>Semmilyen adatot nem mentünk és nem küldünk el.</strong> A számítás csak a te
              böngésződben fut, a beírt összegek az oldal bezárásakor eltűnnek.{" "}
              <a href="adatvedelem.html">Részletek</a>
            </span>
          </div>

          {/* Project amount */}
          <div className="input-group">
            <label className="input-label">Projekt összege (bruttó bevétel)</label>
            <input
              className="input-field"
              type="number"
              min="0"
              placeholder="pl. 500 000"
              value={projectAmount}
              onChange={(e) => setProjectAmount(e.target.value)}
            />
            <div className="input-hint">HUF · az összeg amit a számládon kiállítasz</div>
          </div>

          {/* Cost ratio selector */}
          <label className="input-label">Költséghányad</label>
          <div className="cost-ratio-row">
            {COST_RATIOS.map((cr) => (
              <button
                key={cr.value}
                className={`cost-ratio-btn ${costRatio === cr.value ? "active" : ""}`}
                onClick={() => setCostRatio(cr.value)}
              >
                <span className="pct">{cr.label}</span>
                <span className="desc">{cr.desc}</span>
              </button>
            ))}
          </div>
          <div className="input-hint" style={{ marginBottom: 20 }}>
            Jövedelem = bevétel × {Math.round(incomeRatio * 100)}% · ha más tevékenységből is van bevételed, minden bevételre 45% jár
          </div>

          {/* SZJA-free band toggle */}
          <label className="input-label" style={{ marginBottom: 10 }}>
            SZJA-mentes sáv (idei jövedelem {'<'} {formatHuf(TAX_RULES_2026.taxFreeIncome)})
          </label>
          <div className="toggle-row">
            <button
              className={`toggle-btn ${!aboveTaxFree ? "active" : ""}`}
              onClick={() => setAboveTaxFree(false)}
            >
              ✦ Még alatta vagyok
            </button>
            <button
              className={`toggle-btn ${aboveTaxFree ? "active" : ""}`}
              onClick={() => setAboveTaxFree(true)}
            >
              Már felette vagyok
            </button>
          </div>
          <div className="input-hint" style={{ marginBottom: 20, marginTop: -8 }}>
            {costRatio === 0.45 ? "45%-os" : costRatio === 0.8 ? "80%-os" : "90%-os"} költséghányadnál
            kb. {formatHuf(Math.floor(TAX_RULES_2026.taxFreeIncome / incomeRatio))} éves bevételig tart a sáv.
            A sávba eső jövedelem után SZJA, TB és szocho sem jár.
          </div>

          {/* Status */}
          <label className="input-label" style={{ marginBottom: 10 }}>
            Jogállás
          </label>
          <div className="toggle-row">
            {STATUS_OPTIONS.map((opt) => (
              <button
                key={opt.value}
                className={`toggle-btn ${status === opt.value ? "active" : ""}`}
                onClick={() => setStatus(opt.value)}
              >
                {opt.label}
              </button>
            ))}
          </div>

          {/* Degree requirement */}
          {isMain && (
            <>
              <label className="input-label" style={{ marginBottom: 10 }}>
                Tevékenység szintje (min. járulékalaphoz)
              </label>
              <div className="toggle-row">
                <button
                  className={`toggle-btn ${!requiresDegree ? "active" : ""}`}
                  onClick={() => setRequiresDegree(false)}
                >
                  Nem kell végzettség
                </button>
                <button
                  className={`toggle-btn ${requiresDegree ? "active" : ""}`}
                  onClick={() => setRequiresDegree(true)}
                >
                  Középfokú végz. kell
                </button>
              </div>
            </>
          )}

          {/* SZJA exemption */}
          <label className="input-label" style={{ marginBottom: 10 }}>
            SZJA-kedvezmény
          </label>
          <div className="toggle-row">
            <button
              className={`toggle-btn ${!szjaExempt ? "active" : ""}`}
              onClick={() => setSzjaExempt(false)}
            >
              Nincs
            </button>
            <button
              className={`toggle-btn ${szjaExempt ? "active" : ""}`}
              onClick={() => setSzjaExempt(true)}
            >
              Teljes SZJA-mentesség
            </button>
          </div>
          <div className="input-hint" style={{ marginBottom: 20, marginTop: -8 }}>
            Pl. háromgyermekes anyák, kétgyermekes anyák (2026-ban 40 év alatt), 30 év alatti anyák, 25 év alattiak (utóbbi kettőnél összeghatárig).
            A TB-járulék és a szocho ilyenkor is fizetendő.
          </div>

          {/* Results */}
          {result && (
            <>
              <div className="divider" />

              <div className="result-section">
                {result.overRevenueLimit && (
                  <div className="info-banner" style={{
                    background: "rgba(248, 113, 113, 0.08)",
                    borderColor: "rgba(248, 113, 113, 0.2)",
                    marginTop: 0,
                    marginBottom: 20,
                  }}>
                    <span className="icon" style={{ color: "#f87171" }}>⚠</span>
                    <span className="text">
                      Ez a projekt egymagában átlépi az átalányadózás éves bevételi határát
                      ({formatHuf(result.revenueLimit)}). Ilyenkor megszűnik az átalányadózásra való jogosultság,
                      és az alábbi számítás nem érvényes — fordulj könyvelőhöz!
                    </span>
                  </div>
                )}

                <div className="result-hero">
                  <div className="label">Neked marad</div>
                  <div className="amount">{formatHuf(result.netIncome)}</div>
                  <div className="sub">
                    a {formatHuf(result.revenue)} bevételből ·{" "}
                    {calcPercent(result.netIncome, result.revenue)}%
                  </div>
                </div>

                {/* Visual bar */}
                <div className="breakdown-card">
                  <div className="card-title">Megoszlás</div>
                  <div className="bar-container">
                    <div
                      className="bar-segment"
                      style={{
                        width: `${calcPercent(result.netIncome, result.revenue)}%`,
                        background: "linear-gradient(135deg, #4ade80, #22c55e)",
                      }}
                    >
                      {calcPercent(result.netIncome, result.revenue)}%
                    </div>
                    {result.szja > 0 && (
                      <div
                        className="bar-segment"
                        style={{
                          width: `${calcPercent(result.szja, result.revenue)}%`,
                          background: "#f87171",
                        }}
                      />
                    )}
                    <div
                      className="bar-segment"
                      style={{
                        width: `${calcPercent(result.tb, result.revenue)}%`,
                        background: "#fb923c",
                      }}
                    />
                    <div
                      className="bar-segment"
                      style={{
                        width: `${calcPercent(result.szocho, result.revenue)}%`,
                        background: "#fbbf24",
                      }}
                    />
                  </div>
                  <div className="bar-legend">
                    <div className="bar-legend-item">
                      <span className="swatch" style={{ background: "#4ade80" }} />
                      Nettó
                    </div>
                    <div className="bar-legend-item">
                      <span className="swatch" style={{ background: "#f87171" }} />
                      SZJA
                    </div>
                    <div className="bar-legend-item">
                      <span className="swatch" style={{ background: "#fb923c" }} />
                      TB
                    </div>
                    <div className="bar-legend-item">
                      <span className="swatch" style={{ background: "#fbbf24" }} />
                      SZOCHO
                    </div>
                  </div>
                </div>

                {/* Tax breakdown */}
                <div className="breakdown-card">
                  <div className="card-title">Adó részletezés</div>

                  <div className="breakdown-row">
                    <div className="left">
                      <span className="name">
                        Bevétel <span className="rate">bruttó</span>
                      </span>
                    </div>
                    <span className="value">{formatHuf(result.revenue)}</span>
                  </div>

                  <div className="breakdown-row">
                    <div className="left">
                      <span className="name">
                        Költséghányad <span className="rate">{Math.round(costRatio * 100)}%</span>
                      </span>
                    </div>
                    <span className="value" style={{ color: "#6b7280" }}>
                      − {formatHuf(result.costDeduction)}
                    </span>
                  </div>

                  <div className="breakdown-row">
                    <div className="left">
                      <span className="name">
                        Jövedelem <span className="rate">{Math.round(incomeRatio * 100)}%</span>
                      </span>
                    </div>
                    <span className="value">{formatHuf(result.income)}</span>
                  </div>

                  <div className="breakdown-row">
                    <div className="left">
                      <span className="name">
                        ebből mentes sávba esik <span className="rate">SZJA, TB, szocho nélkül</span>
                      </span>
                    </div>
                    <span className="value" style={{ color: "#6b7280" }}>{formatHuf(result.taxFreePart)}</span>
                  </div>

                  <div className="breakdown-row">
                    <div className="left">
                      <span className="name">
                        ebből adóköteles <span className="rate">a terhek alapja</span>
                      </span>
                    </div>
                    <span className="value">{formatHuf(result.taxableIncome)}</span>
                  </div>

                  <div style={{ height: 8 }} />

                  <div className="breakdown-row">
                    <div className="left">
                      <div className="dot" style={{ background: "#f87171" }} />
                      <span className="name">
                        SZJA <span className="rate">{szjaExempt ? "0% (kedvezmény)" : "15%"}</span>
                      </span>
                    </div>
                    <span className="value">{formatHuf(result.szja)}</span>
                  </div>

                  <div className="breakdown-row">
                    <div className="left">
                      <div className="dot" style={{ background: "#fb923c" }} />
                      <span className="name">
                        TB járulék <span className="rate">{isPensioner ? "0% (nyugdíjas)" : "18,5%"}</span>
                      </span>
                    </div>
                    <span className="value">{formatHuf(result.tb)}</span>
                  </div>

                  <div className="breakdown-row">
                    <div className="left">
                      <div className="dot" style={{ background: "#fbbf24" }} />
                      <span className="name">
                        SZOCHO <span className="rate">{isPensioner ? "0% (nyugdíjas)" : "13%"}</span>
                      </span>
                    </div>
                    <span className="value">{formatHuf(result.szocho)}</span>
                  </div>

                  <div className="breakdown-row total">
                    <div className="left">
                      <span className="name">Félretenni való</span>
                    </div>
                    <span className="value">{formatHuf(result.totalTax)}</span>
                  </div>
                </div>

                {/* Tax-free band info */}
                {result.taxableIncome === 0 && (
                  <div className="info-banner">
                    <span className="icon">✦</span>
                    <span className="text">
                      Az SZJA-mentes sávban vagy — erre a projektre <strong>nem kell SZJA-t, TB-t és szochót fizetned</strong>.
                      Ha ezzel a projekttel átléped a sávot, a felette lévő rész után már fizetsz: ilyenkor
                      a „Már felette vagyok” gomb a biztonságos becslés.
                    </span>
                  </div>
                )}

                {result.taxableIncome > 0 && result.taxFreePart > 0 && (
                  <div className="info-banner">
                    <span className="icon">✦</span>
                    <span className="text">
                      A projekt jövedelme egymagában nagyobb a sávnál: {formatHuf(result.taxFreePart)} még
                      mentes, a többi {formatHuf(result.taxableIncome)} után már fizetsz. Ha a sávból idén már
                      elhasználtál, ennél többet.
                    </span>
                  </div>
                )}

                {result.taxableIncome > 0 && result.taxFreePart === 0 && (
                  <div className="info-banner" style={{
                    background: "rgba(248, 113, 113, 0.08)",
                    borderColor: "rgba(248, 113, 113, 0.2)"
                  }}>
                    <span className="icon" style={{ color: "#f87171" }}>✦</span>
                    <span className="text">
                      Túllépted az SZJA-mentes sávot — a projekt teljes jövedelme után fizetsz SZJA-t, TB-t és szochót.
                    </span>
                  </div>
                )}

                {isMain && (
                  <div className="warning-banner">
                    <span className="icon">⚠</span>
                    <span className="text">
                      Főfoglalkozásúként minimum havi járulékfizetésed:{" "}
                      <strong>{formatHuf(result.monthlyMinTotal)}</strong>
                      {" "}(TB: {formatHuf(result.monthlyMinTb)} + SZOCHO: {formatHuf(result.monthlyMinSocho)})
                      — akkor is, ha nem számlázol.
                      Alap: {requiresDegree ? "garantált bérminimum" : "minimálbér"} ({formatHuf(result.minBase)}/hó).
                      A projekt TB- és szocho-összege felső becslés: a már befizetett minimum a negyedéves
                      elszámolásnál beszámíthat.
                    </span>
                  </div>
                )}

                {isPensioner && (
                  <div className="warning-banner">
                    <span className="icon">⚠</span>
                    <span className="text">
                      Nyugdíjasként (kiegészítő tevékenységet folytatóként) TB-járulékot és szochót nem fizetsz, csak SZJA-t.
                    </span>
                  </div>
                )}

                <div className="footer-note">
                  ÁTALÁNYADÓ · {Math.round(costRatio * 100)}% KÖLTSÉGHÁNYAD · 2026 · ALANYI ÁFA MENTES
                </div>
              </div>
            </>
          )}

          <div className="disclaimer">
            A kalkulátor tájékoztató jellegű, nem minősül adótanácsadásnak.
            Az eredmény egyszerűsített számítás; konkrét esetben fordulj könyvelőhöz,
            vagy nézd meg a NAV aktuális tájékoztatóit.
            <br />
            <a href="adatvedelem.html" style={{ color: "#6b7280" }}>Adatkezelési tájékoztató</a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
